<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welch Ave. Station</title>
    <style>
      :root {
        --bg: #000000;
        --panel: #111111;
        --text: #f5f5f5;
        --muted: #d1d5db;
        --accent: #d97706;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      nav {
        position: sticky;
        top: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.9);
        border-bottom: 1px solid #333;
      }

      .nav-inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .nav-links {
        display: flex;
        list-style: none;
        gap: 2rem;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }

      .nav-links a:hover {
        color: var(--accent);
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 4rem 2rem 2rem;
      }

      .content {
        background: var(--panel);
        border: 1px solid #222;
        border-radius: 10px;
        padding: 2rem;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.25rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-inner">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="landing.html">Landing</a></li>
          <li><a href="ads.html">Ads</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <div class="content">
        <p>this is our webstie</p>
      </div>
    </main>
  </body>
</html>
